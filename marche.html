<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マルシェ出店情報 | 小さなパン工房ミール</title>
    <link rel="icon" href="logo.jpg">
    
    <style>
        /* 全体のリセットと基本設定 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            color: #4a3b32;
            background-color: #fcf9f5;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* ヘッダー */
        header {
            background-color: #ffffff;
            border-bottom: 2px solid #f0e6df;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 15px 10px;
        }

        .logo {
            font-size: 1.4rem;
            color: #8b5a2b;
            text-align: center;
            font-weight: bold;
        }

        nav ul {
            display: flex;
            list-style: none;
            justify-content: center;
        }

        nav ul li {
            margin: 0 10px;
        }

        nav ul li a {
            text-decoration: none;
            color: #705d53;
            font-weight: bold;
            font-size: 0.9rem;
            transition: color 0.3s;
            white-space: nowrap;
        }

        nav ul li a:hover, nav ul li a.active {
            color: #d27d2d;
        }

        @media (min-width: 600px) {
            .header-container {
                flex-direction: row;
                justify-content: space-between;
                padding: 15px 20px;
            }
            nav ul li {
                margin-left: 20px;
                margin-right: 0;
            }
            .logo {
                font-size: 1.5rem;
            }
            nav ul li a {
                font-size: 0.95rem;
            }
        }

        /* ページタイトル */
        h2 {
            font-size: 1.6rem;
            color: #8b5a2b;
            border-bottom: 2px solid #8b5a2b;
            padding-bottom: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .intro-text {
            text-align: center;
            margin-bottom: 40px;
            color: #705d53;
        }

        /* マルシェ大カード */
        .marche-highlight {
            background-color: #ffffff;
            border: 2px solid #d27d2d;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px; /* 💡 カード間の余白 */
            box-shadow: 0 6px 16px rgba(210,125,45,0.05);
            position: relative;
        }

        .highlight-badge {
            position: absolute;
            top: -15px;
            left: 30px;
            background-color: #d27d2d;
            color: white;
            padding: 4px 15px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 20px;
            letter-spacing: 1px;
        }

        /* 💡 2番目以降のカードのバッジ色を少し落ち着いたブラウンにする設定 */
        .marche-highlight.future-marche {
            border-color: #c2b2a6;
        }
        .marche-highlight.future-marche .highlight-badge {
            background-color: #a67c52;
        }

        .marche-title {
            font-size: 1.5rem;
            color: #8b5a2b;
            margin-bottom: 20px;
            margin-top: 5px;
        }

        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .info-table tr {
            border-bottom: 1px solid #f0e6df;
        }

        .info-table tr:last-child {
            border-bottom: none;
        }

        .info-table th, .info-table td {
            padding: 12px 8px;
            text-align: left;
        }

        .info-table th {
            width: 100px;
            color: #a67c52;
            font-weight: bold;
            white-space: nowrap;
        }

        .info-table td {
            font-size: 1.05rem;
        }

        .marche-message {
            background-color: #fff9f5;
            border-left: 4px solid #d27d2d;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            color: #55443a;
        }
        .marche-highlight.future-marche .marche-message {
            border-left-color: #a67c52;
        }

        /* ご案内セクション */
        .notice-box {
            background-color: #f5efe6;
            border-radius: 8px;
            padding: 20px;
            margin-top: 40px;
        }

        .notice-box h3 {
            font-size: 1.1rem;
            color: #8b5a2b;
            margin-bottom: 10px;
        }

        .notice-box ul {
            padding-left: 20px;
            font-size: 0.9rem;
            color: #66554a;
        }

        .notice-box li {
            margin-bottom: 5px;
        }

        /* フッター */
        footer {
            background-color: #4a3b32;
            color: #fcf9f5;
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <h1 class="logo">小さなパン工房ミール</h1>
            <nav>
                <ul>
                    <li><a href="/">ホーム</a></li>
                    <li><a href="/menu">メニュー</a></li>
                    <li><a href="/order">注文</a></li>
                    <li><a href="/mypage">マイページ</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2>マルシェ出店情報</h2>
        <p class="intro-text">小さなパン工房ミールがお邪魔する、今後のマルシェスケジュールです！</p>
        
        <div id="marche-list-container">
            <p style="text-align: center; padding: 20px;">スケジュールを読み込み中...</p>
        </div>

        <div class="notice-box">
            <h3>🎪 マルシェにお越しのお客さまへ</h3>
            <ul>
                <li>商品はすべて数量限定のため、売り切れ次第終了となる場合がございます。</li>
                <li>悪天候などによるマルシェの開催可否については、主催者様の発表に準じます。</li>
            </ul>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 小さなパン工房ミール. All Rights Reserved.</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // Firebase初期化設定
        const firebaseConfig = {
            apiKey: "AIzaSyAnEWphWXdlGamhQPp5i1HFOg6TcDoQqdg",
            authDomain: "mir-and-cosu.firebaseapp.com",
            projectId: "mir-and-cosu",
            storageBucket: "mir-and-cosu.firebasestorage.app",
            messagingSenderId: "597556523101",
            appId: "1:597556523101:web:338d402cd97dbf23c15db4",
            measurementId: "G-294PKSL137"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // ページ読み込み時にFirestoreから自動で今日以降のマルシェ情報を複数件取得
        document.addEventListener("DOMContentLoaded", async () => {
            const container = document.getElementById("marche-list-container");
            try {
                // 今日の日付を取得 (YYYY-MM-DD形式)
                const todayStr = new Date().toISOString().split('T')[0];

                // 今日以降の日付のデータを、日付順（近い順）に最大5件取得
                const querySnapshot = await db.collection("marche_info")
                    .where("date", ">=", todayStr)
                    .orderBy("date", "asc")
                    .limit(5)
                    .get();
                
                container.innerHTML = ""; // 読み込み中テキストをクリア

                if (querySnapshot.empty) {
                    container.innerHTML = "<p style='text-align: center; padding: 30px; color: #705d53;'>現在、次回の出店予定は未定です。決まり次第こちらでお知らせします！</p>";
                    return;
                }

                // ループ処理でカードを動的に生成
                querySnapshot.forEach((doc, index) => {
                    const data = doc.data();
                    
                    // 1番近いマルシェは「次回出店」、2番目以降は「出店予定」とバッジとスタイルを分ける
                    const isFirst = (index === 0);
                    const badgeText = isFirst ? "次回出店" : "出店予定";
                    const cardClass = isFirst ? "marche-highlight" : "marche-highlight future-marche";

                    const marcheCard = document.createElement("div");
                    marcheCard.className = cardClass;
                    
                    marcheCard.innerHTML = `
                        <div class="highlight-badge">${badgeText}</div>
                        <h3 class="marche-title">${data.name || '出店予定'}</h3>
                        
                        <table class="info-table">
                            <tr>
                                <th>📅 日時</th>
                                <td>${data.datetime || '-'}</td>
                            </tr>
                            <tr>
                                <th>📍 場所</th>
                                <td>${data.location || '-'}</td>
                            </tr>
                        </table>

                        ${data.description ? `
                            <div class="marche-message">
                                <p>${data.description}</p>
                            </div>
                        ` : ''}
                    `;
                    
                    container.appendChild(marcheCard);
                });

            } catch (error) {
                console.error("マルシェ情報の取得に失敗しました:", error);
                container.innerHTML = "<p style='text-align: center; color: red; padding: 20px;'>情報の読み込みに失敗しました</p>";
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイページ | 小さなパン工房ミール</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        /* 全体のリセットと基本設定 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            color: #4a3b32;
            background-color: #fcf9f5;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* ヘッダー */
        header {
            background-color: #ffffff;
            border-bottom: 2px solid #f0e6df;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column; /* 💡 スマホでは縦並びにする */
            align-items: center;
            gap: 10px;
            padding: 15px 10px;
        }

        .logo {
            font-size: 1.4rem;
            color: #8b5a2b;
            text-align: center;
            font-weight: bold;
        }

        nav ul {
            display: flex;
            list-style: none;
            justify-content: center;
        }

        nav ul li {
            margin: 0 10px;
        }

        nav ul li a {
            text-decoration: none;
            color: #705d53;
            font-weight: bold;
            font-size: 0.9rem;
            transition: color 0.3s;
            white-space: nowrap;
        }

        nav ul li a:hover, nav ul li a.active {
            color: #d27d2d;
        }

        @media (min-width: 600px) {
            .header-container {
                flex-direction: row;
                justify-content: space-between;
                padding: 15px 20px;
            }
            nav ul li {
                margin-left: 20px;
                margin-right: 0;
            }
            .logo {
                font-size: 1.5rem;
            }
            nav ul li a {
                font-size: 0.95rem;
            }
        }

        /* 会員情報カード */
        .user-profile {
            background-color: #ffffff;
            border: 1px solid #eaddd5;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        /* 予約（QRコード）カード */
        .order-card {
            background-color: #ffffff;
            border: 2px solid #d27d2d;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(210,125,45,0.05);
            transition: all 0.3s ease;
        }

        .order-status-badge {
            display: inline-block;
            background-color: #d27d2d;
            color: white;
            padding: 3px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .order-meta {
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        /* QRコードを表示するエリア */
        .qrcode-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #fff9f5;
            border: 1px dashed #eaddd5;
            padding: 20px;
            border-radius: 6px;
            margin: 20px 0;
            text-align: center;
        }

        #qrcode {
            margin-bottom: 10px;
            padding: 10px;
            background-color: white;
            border: 1px solid #eee;
            min-height: 180px; /* QR生成前のガタつき防止 */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qrcode-hint {
            font-size: 0.85rem;
            color: #705d53;
            font-weight: bold;
        }

        /* フッター */
        footer {
            background-color: #4a3b32;
            color: #fcf9f5;
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            margin-top: 50px;
        }

        .no-orders {
            text-align: center;
            padding: 30px;
            background: white;
            border: 1px solid #eaddd5;
            border-radius: 8px;
            color: #705d53;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <h1 class="logo">小さなパン工房ミール</h1>
            <nav>
                <ul>
                    <li><a href="/index">ホーム</a></li>
                    <li><a href="/menu">メニュー</a></li>
                    <li><a href="/order">注文</a></li>
                    <li><a href="/mypage" class="active">マイページ</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div id="auth-section">
            <h2>ログイン / 新規会員登録</h2>
            <div class="user-profile" style="margin-bottom: 20px; margin-top: 20px;">
                <h3>メールアドレスでログイン</h3>
                <br>
                <input type="email" id="auth-email" placeholder="メールアドレス" style="width:100%; padding:10px; margin-bottom:10px;">
                <input type="password" id="auth-password" placeholder="パスワード（6文字以上）" style="width:100%; padding:10px; margin-bottom:15px;">
                <button id="btn-login" style="padding:10px 20px; background:#8b5a2b; color:white; border:none; border-radius:4px; cursor:pointer; margin-right:10px; font-weight:bold;">ログイン</button>
                <button id="btn-register" style="padding:10px 20px; background:#705d53; color:white; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">新規登録</button>
            </div>
        </div>

        <div id="mypage-content" style="display: none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
                <h2>マイページ</h2>
                <button id="btn-logout" style="padding:5px 10px; background:#cc0000; color:white; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">ログアウト</button>
            </div>

            <section class="user-profile">
                <h3>ミール 会員情報</h3>
                <br>
                <p><strong>ログイン中のメールアドレス：</strong> <span id="user-email-display"></span></p>
                
                <div id="verification-status" style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed #eaddd5;">
                    <p id="status-verified" style="color: #28a745; font-weight: bold; display: none;">✅ メールアドレスは認証済みです</p>
                    <div id="status-unverified" style="display: none;">
                        <p style="color: #dc3545; font-weight: bold;">⚠️ メールアドレスの認証が完了していません。</p>
                        <button id="btn-send-verification" style="margin-top: 10px; padding: 8px 15px; background-color: #d27d2d; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                            認証メールを再送する
                        </button>
                    </div>
                </div>
            </section>

            <section>
                <h2>現在の予約・受取用QRコード</h2>
                <br>
                <div id="orders-container">
                    <div class="no-orders">注文履歴を読み込んでいます...</div>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 小さなパン工房ミール. All Rights Reserved.</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // Firebase設定
        const firebaseConfig = {
            apiKey: "AIzaSyAnEWphWXdlGamhQPp5i1HFOg6TcDoQqdg",
            authDomain: "mir-and-cosu.firebaseapp.com",
            projectId: "mir-and-cosu",
            storageBucket: "mir-and-cosu.firebasestorage.app",
            messagingSenderId: "597556523101",
            appId: "1:597556523101:web:338d402cd97dbf23c15db4",
            measurementId: "G-294PKSL137"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        let ordersListener = null; // リアルタイム監視解除用リマインダー

        // ログイン状態の監視
        auth.onAuthStateChanged((user) => {
            const authSection = document.getElementById('auth-section');
            const mypageContent = document.getElementById('mypage-content');
            const emailDisplay = document.getElementById('user-email-display');
            
            const statusVerified = document.getElementById('status-verified');
            const statusUnverified = document.getElementById('status-unverified');

            if (user) {
                authSection.style.display = 'none';
                mypageContent.style.display = 'block';
                emailDisplay.innerText = user.email;

                // 💡 メール認証状態によって表示を切り替える
                if (user.emailVerified) {
                    statusVerified.style.display = 'block';
                    statusUnverified.style.display = 'none';
                } else {
                    statusVerified.style.display = 'none';
                    statusUnverified.style.display = 'block';
                }
                
                // 💡 リアルタイムリスナーで注文履歴を追跡開始
                loadUserOrdersRealtime(user.uid);
            } else {
                authSection.style.display = 'block';
                mypageContent.style.display = 'none';
                if (ordersListener) {
                    ordersListener(); // リスナーを解除
                    ordersListener = null;
                }
            }
        });

        // 💡 認証メール再送処理
        document.getElementById('btn-send-verification').addEventListener('click', async () => {
            const user = auth.currentUser;
            if (user) {
                try {
                    await user.sendEmailVerification();
                    alert("📩 認証メールを再送信しました！メールボックスを確認してください。\n※届かない場合は迷惑メールフォルダもご確認ください。");
                } catch (error) {
                    console.error("メール再送エラー:", error);
                    alert("❌ メールの送信に失敗しました: " + error.message);
                }
            }
        });

        // 💡 Firestoreから最新の注文データをリアルタイムで取得・描写する関数
        function loadUserOrdersRealtime(userId) {
            const container = document.getElementById('orders-container');
            
            // 既存の監視があれば一度解除する
            if (ordersListener) ordersListener();

            ordersListener = db.collection("orders")
                .where("userId", "==", userId)
                .orderBy("createdAt", "desc")
                .onSnapshot((snapshot) => {
                    if (snapshot.empty) {
                        container.innerHTML = `<div class="no-orders">現在のご注文予約はありません。</div>`;
                        return;
                    }

                    container.innerHTML = ""; // 初期表示をクリア

                    // 最新の1件を取得して表示
                    const newestOrderDoc = snapshot.docs[0];
                    const order = newestOrderDoc.data();
                    const orderId = newestOrderDoc.id;

                    // 期限切れの簡易判定（フロント表示用）
                    let currentStatus = order.status;
                    if (currentStatus === 'pending' && order.expireAt) {
                        const now = new Date().getTime();
                        if (now > order.expireAt.toDate().getTime()) {
                            currentStatus = 'cancelled';
                        }
                    }

                    // ステータス別の表示テキストと色の割り当て
                    let statusText = "注文完了・未受取";
                    let badgeColor = "#d27d2d";
                    let cardBorder = "2px solid #d27d2d";
                    let cardBackground = "#ffffff";
                    let qrCodeHtml = `
                        <div class="qrcode-area">
                            <div id="qrcode"></div>
                            <p class="qrcode-hint">店頭でこのQRコードを店員にご提示ください</p>
                        </div>
                    `;
                    let actionButtonHtml = "";

                    if (currentStatus === "preparing") statusText = "ご用意中";
                    if (currentStatus === "ready") {
                        statusText = "受け取り可能";
                        badgeColor = "#28a745";
                    }
                    if (currentStatus === "completed") {
                        statusText = "受け取り済み";
                        badgeColor = "#6c757d";
                    }
                    
                    // 💡 新規追加：メール確認待ち（保留）のスタイル
                    if (currentStatus === "pending") {
                        statusText = "📩 メール確認待ち";
                        badgeColor = "#ffc107";
                        cardBorder = "2px solid #ffc107";
                        cardBackground = "#fffdf6";
                        qrCodeHtml = ""; // 確定前なのでQRは非表示
                        actionButtonHtml = `
                            <button onclick="window.location.href='confirm.html?id=${orderId}'" style="margin-top: 15px; width: 100%; padding: 12px; background-color: #d27d2d; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s;">
                                👉 1時間以内にここから注文を確定する
                            </button>
                        `;
                    }

                    // 💡 新規追加：キャンセル済みのスタイル
                    if (currentStatus === "cancelled") {
                        statusText = "❌ キャンセル済み";
                        badgeColor = "#dc3545";
                        cardBorder = "1px solid #e2e3e5";
                        cardBackground = "#f8f9fa";
                        qrCodeHtml = ""; // キャンセルなのでQRは非表示
                    }

                    // 商品内訳の作成
                    let itemsHtml = "";
                    for (const [name, qty] of Object.entries(order.items)) {
                        itemsHtml += `🥖 ${name} × ${qty}<br>`;
                    }

                    // 受取または発送の情報を構築
                    let metaHtml = "";
                    if (order.orderType === "kobo") {
                        metaHtml = `📅 <strong>受取希望日：</strong> ${order.pickupDate} ${order.pickupTime || ""}`;
                    } else {
                        const rangeText = order.shippingRange === "next-week" ? "来週中に順次発送" : "今月末に順次発送";
                        metaHtml = `📦 <strong>配送予定：</strong> ${rangeText}<br>📍 <strong>お届け先：</strong> ${order.address}`;
                    }

                    // HTML構築
                    const cardHtml = `
                        <div class="order-card" style="border: ${cardBorder}; background-color: ${cardBackground};">
                            <div class="order-status-badge" style="background-color: ${badgeColor};">${statusText}</div>
                            <h3>ご注文内容</h3>
                            <br>
                            <p class="order-meta">${metaHtml}</p>
                            <p class="order-meta">🔢 <strong>注文番号：</strong> <span id="order-id-display">${orderId}</span></p>
                            
                            ${qrCodeHtml}
                            ${actionButtonHtml}

                            <p style="font-size: 0.95rem; border-top: 1px dashed #eaddd5; padding-top: 15px; margin-top: 15px;">
                                ${itemsHtml}
                                <br>
                                <span style="font-size: 1.1rem; color: #d27d2d;">💰 <strong>合計金額：¥${order.totalPrice.toLocaleString()}（現地でお支払い）</strong></span>
                            </p>
                        </div>
                    `;

                    container.innerHTML = cardHtml;

                    // 確定済みのステータスのみQRコードをレンダリングする
                    if (["ordered", "preparing", "ready", "completed"].includes(currentStatus)) {
                        new QRCode(document.getElementById("qrcode"), {
                            text: orderId,
                            width: 160,
                            height: 160,
                            colorDark : "#4a3b32",
                            colorLight : "#ffffff"
                        });
                    }

                }, (error) => {
                    console.error("リアルタイム取得エラー:", error);
                    container.innerHTML = `<div class="no-orders" style="color: red;">データ同期中にエラーが発生しました。<br>${error.message}</div>`;
                });
        }

        // 会員登録処理
        document.getElementById('btn-register').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if(!email || !password) { alert("メールアドレスとパスワードを入力してください。"); return; }
            
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                // 💡 新規登録完了と同時に初回認証メールを自動送信する仕組み
                await userCredential.user.sendEmailVerification();
                alert("会員登録に成功しました！認証メールを送信したのでご確認ください。");
            } catch (error) {
                alert("登録エラー: " + error.message);
            }
        });

        // ログイン処理
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if(!email || !password) { alert("メールアドレスとパスワードを入力してください。"); return; }

            try {
                await auth.signInWithEmailAndPassword(email, password);
                alert("ログインしました！");
            } catch (error) {
                alert("ログインエラー: " + error.message);
            }
        });

        // ログアウト処理
        document.getElementById('btn-logout').addEventListener('click', async () => {
            try {
                await auth.signOut();
                alert("ログアウトしました。");
            } catch (error) {
                alert("ログアウトエラー: " + error.message);
            }
        });
    </script>
</body>
</html>

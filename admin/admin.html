<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【管理画面】販売日・在庫の管理 | 小さなパン工房ミール</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            color: #4a3b32;
            background-color: #f8f1eb;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 30px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 {
            font-size: 1.5rem;
            color: #8b5a2b;
            border-bottom: 3px solid #8b5a2b;
            padding-bottom: 10px;
            margin-bottom: 25px;
            text-align: center;
        }

        .form-section {
            margin-bottom: 30px;
            background: #fff9f5;
            padding: 20px;
            border: 1px solid #eaddd5;
            border-radius: 8px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        select, input[type="date"] {
            width: 100%;
            padding: 12px;
            font-size: 1.2rem;
            border: 2px solid #c2b2a6;
            border-radius: 6px;
            color: #4a3b32;
            background-color: white;
        }

        select {
            cursor: pointer;
        }

        .product-list {
            margin-top: 15px;
        }

        .product-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px dashed #eaddd5;
        }

        .product-name {
            font-weight: bold;
            font-size: 1rem;
            flex: 1;
        }

        .counter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .count-btn {
            width: 40px;
            height: 40px;
            background-color: #eaddd5;
            color: #4a3b32;
            border: none;
            border-radius: 6px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .count-btn:active {
            background-color: #c2b2a6;
        }

        .count-input {
            width: 60px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 5px;
            border: 2px solid #c2b2a6;
            border-radius: 6px;
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 18px;
            background-color: #d27d2d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background-color: #b66620;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🍞 販売日とパンの数を決める画面</h2>

        <div class="form-section">
            <label for="sale-type">① 販売方法を選んでください</label>
            <select id="sale-type">
                <option value="store">🏠 工房販売</option>
                <option value="delivery">📦 冷凍発送</option>
            </select>
        </div>

        <div class="form-section">
            <label for="sale-date">② 次の販売日・発送日はいつですか？</label>
            <input type="date" id="sale-date">
        </div>

        <div class="form-section">
            <label>③ 各パンの種類と、その日に用意する数を決めてください</label>
            <div class="product-list" id="product-container"></div>
        </div>

        <button type="button" class="submit-btn" onclick="saveSalesDay()">この内容で追加する</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // Firebase初期化設定
        const firebaseConfig = {
            apiKey: "AIzaSyAnEWphWXdlGamhQPp5i1HFOg6TcDoQqdg",
            authDomain: "mir-and-cosu.firebaseapp.com",
            projectId: "mir-and-cosu",
            storageBucket: "mir-and-cosu.firebasestorage.app",
            messagingSenderId: "597556523101",
            appId: "1:597556523101:web:338d402cd97dbf23c15db4",
            measurementId: "G-294PKSL137"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // 登録されているパンの一覧
        const products = [
            "ドーナツ（プレーン）", "ココアドーナツ", "あんドーナツ",
            "ベーグル（プレーン）", "ベーグル（チョコチップ）", "ベーグル（チョコとくるみ）",
            "ベーグル（ダブルチーズ）", "ベーグル（黒ごま塩）", "ベーグル（黒ごまチーズ）",
            "ベーグル（オニオンチーズベーコン）", "ベーグル（ウインナー Mum）", 
            "ベーグル（クランベリーとクリームチーズ）", "ベーグル（高菜そぼろチーズ）",
            "ベーグル（あんことクリームチーズ）", "ベーグル（いちじくキャラメルナッツ）",
            "ホテルブレッド", "くるみとレーズンの黒糖食パン",
            "米粉のシフォン（プレーン）", "米粉のシフォン（チョコチップ）",
            "米粉のシフォン（ミルクティー）", "米粉のシフォン（コーヒーチョコ）",
            "米粉のベイクドチーズケーキ", "米粉のレモンパウンドケーキ"
        ];

        // 画面に商品リストを描画
        const container = document.getElementById('product-container');
        products.forEach((name, index) => {
            const item = document.createElement('div');
            item.className = 'product-item';
            item.innerHTML = `
                <div class="product-name">${name}</div>
                <div class="counter-group">
                    <button type="button" class="count-btn" onclick="changeCount(${index}, -5)">-</button>
                    <input type="number" class="count-input" id="count-${index}" value="10" min="0">
                    <button type="button" class="count-btn" onclick="changeCount(${index}, 5)">+</button>
                </div>
            `;
            container.appendChild(item);
        });

        // 数量のプラスマイナス処理（5個単位で増減）
        window.changeCount = function(index, amount) {
            const input = document.getElementById(`count-${index}`);
            let val = parseInt(input.value) + amount;
            if (val < 0) val = 0;
            input.value = val;
        }

        // Firestoreに保存する処理
        window.saveSalesDay = async function() {
            const typeVal = document.getElementById('sale-type').value; // store または delivery
            const dateVal = document.getElementById('sale-date').value;
            
            if (!dateVal) {
                alert("❌ 日付が選ばれていません。カレンダーから選んでください。");
                return;
            }

            const stockData = {};
            products.forEach((name, index) => {
                const count = parseInt(document.getElementById(`count-${index}`).value) || 0;
                stockData[name] = count;
            });

            // アラート表示用テキストの切り替え
            const typeText = typeVal === "store" ? "工房販売日" : "冷凍発送日";

            try {
                // 日付をドキュメントIDにして保存
                await db.collection("sales_days").doc(dateVal).set({
                    date: dateVal,
                    type: typeVal, // 追加項目: store / delivery
                    stock: stockData,
                    status: "open", // open = 注文受付中
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert(`🎉 【${dateVal}】の${typeText}と個数を登録しました！`);
                
                // 次の入力のために日付をリセット
                document.getElementById('sale-date').value = "";
            } catch (error) {
                alert("❌ 保存に失敗しました:\n" + error.message);
            }
        }
    </script>
</body>
</html>

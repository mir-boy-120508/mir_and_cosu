<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者ログイン | 小さなパン工房ミール</title>
    <style>
        body { font-family: sans-serif; background: #f5efe6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 320px; }
        h2 { color: #8b5a2b; margin-bottom: 20px; font-size: 1.4rem; }
        input { padding: 12px; font-size: 1rem; width: 100%; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 12px; font-size: 1rem; background: #8b5a2b; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #705d53; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>管理者ログイン</h2>
        <input type="email" id="email" placeholder="メールアドレス">
        <input type="password" id="password" placeholder="パスワード">
        <button onclick="handleLogin()">ログイン</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        // 既存のFirebase設定
        const firebaseConfig = {
            apiKey: "AIzaSyAnEWphWXdlGamhQPp5i1HFOg6TcDoQqdg",
            authDomain: "mir-and-cosu.firebaseapp.com",
            projectId: "mir-and-cosu",
            storageBucket: "mir-and-cosu.firebasestorage.app",
            messagingSenderId: "597556523101",
            appId: "1:597556523101:web:338d402cd97dbf23c15db4"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();

        async function handleLogin() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                // Firebase Auth を使ったセキュアなログイン処理
                await auth.signInWithEmailAndPassword(email, password);
                
                // ログイン成功後、ダッシュボード画面等へリダイレクト
                window.location.href = "dashboard.html"; 
            } catch (error) {
                console.error("ログインエラー:", error);
                alert("ログインに失敗しました。メールアドレスまたはパスワードを確認してください。");
            }
        }
    </script>
</body>
</html>

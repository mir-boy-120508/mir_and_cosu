<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小さなパン工房ミール</title>
    
    <style>
        /* 全体のリセットと基本設定 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            color: #4a3b32; /* 濃いブラウン */
            background-color: #fcf9f5; /* 優しい生成り色 */
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

/* ヘッダー */
header {
    background-color: #ffffff;
    border-bottom: 2px solid #f0e6df;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-container {
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    flex-direction: column; /* 💡 スマホでは縦並びにする */
    align-items: center;
    gap: 10px; /* ロゴとナビの間に少し隙間を作る */
    padding: 15px 10px;
}

.logo {
    font-size: 1.4rem;
    color: #8b5a2b;
    text-align: center;
    font-weight: bold;
}

nav ul {
    display: flex;
    list-style: none;
    justify-content: center;
}

nav ul li {
    margin: 0 10px; /* 💡 左右の余白を少し狭めてスマホに収める */
}

nav ul li a {
    text-decoration: none;
    color: #705d53;
    font-weight: bold;
    font-size: 0.9rem; /* 💡 文字サイズを少しだけ小さく */
    transition: color 0.3s;
    white-space: nowrap; /* 💡 文字が途中で改行されるのを防ぐ */
}

nav ul li a:hover, nav ul li a.active {
    color: #d27d2d;
}

/* 💻 画面が広いパソコンで見るとき用の設定 */
@media (min-width: 600px) {
    .header-container {
        flex-direction: row; /* パソコンでは横並びに戻す */
        justify-content: space-between;
        padding: 15px 20px;
    }
    nav ul li {
        margin-left: 20px;
        margin-right: 0;
    }
    .logo {
        font-size: 1.5rem;
    }
    nav ul li a {
        font-size: 0.95rem;
    }
}
        /* メインビジュアル */
        .hero {
            background-color: #e6ccb2; /* パンの焼き色イメージ */
            background-size: cover;
            background-position: center;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .hero-content h2 {
            font-size: 2rem;
            color: #4a3b32;
            margin-bottom: 10px;
        }

        /* セクション共通 */
        section {
            margin-bottom: 50px;
        }

        h2 {
            font-size: 1.6rem;
            color: #8b5a2b;
            border-bottom: 2px solid #8b5a2b;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        /* お知らせ */
        .news-list {
            list-style: none;
        }

        .news-list li {
            padding: 12px 0;
            border-bottom: 1px dashed #e0d0c5;
        }

        .news-list .date {
            font-weight: bold;
            color: #a67c52;
            margin-right: 15px;
        }

        /* マルシェカード */
        .marche-card {
            background-color: #ffffff;
            border: 1px solid #eaddd5;
            border-radius: 8px;
            padding: 25px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            position: relative;
        }

        .marche-badge {
            position: absolute;
            top: -12px;
            left: 20px;
            background-color: #d27d2d;
            color: white;
            padding: 3px 10px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 20px;
        }

        .marche-card h3 {
            margin-bottom: 15px;
            color: #4a3b32;
        }

        .marche-meta {
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        /* フッター */
        footer {
            background-color: #4a3b32;
            color: #fcf9f5;
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <h1 class="logo">小さなパン工房ミール</h1>
            <nav>
                <ul>
                    <li><a href="/" class="active">ホーム</a></li>
                    <li><a href="/menu">メニュー・注文</a></li>
                    <li><a href="/mypage">マイページ</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2>美味しいを<br>お届けします</h2>
            <p>長崎県産卵と酵母を使用</p>
        </div>
    </section>

    <main class="container">
        
        <section class="news-section">
            <h2>おしらせ</h2>
            <ul class="news-list">
                <li><span class="date">2026.07.12</span> ホームページを開設しました！</li>
            </ul>
        </section>

        <section class="marche-section">
            <h2>マルシェ出店情報</h2>
            <p>お近くのマルシェで、みなさまにお会いできるのを楽しみにしています！</p>
            
            <div class="marche-card">
                <div class="marche-badge">次回出店</div>
                <h3>どこでしょうね</h3>
                <p class="marche-meta">📅 <strong>日時：</strong> 2026年x月x日(日) 10:00 〜 15:00</p>
                <p class="marche-meta">📍 <strong>場所：</strong> どこかの公園 大広場</p>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 小さなパン工房ミール. All Rights Reserved.</p>
    </footer>

</body>
</html>

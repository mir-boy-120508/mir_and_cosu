<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仮注文完了・メールをご確認ください | 小さなパン工房ミール</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            color: #4a3b32;
            background-color: #fcf9f5;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }

        header {
            background-color: #ffffff;
            border-bottom: 2px solid #f0e6df;
            padding: 15px 0;
        }

        .logo {
            font-size: 1.4rem;
            color: #8b5a2b;
            font-weight: bold;
        }

        .notice-box {
            background-color: #ffffff;
            border: 1px solid #eaddd5;
            border-radius: 8px;
            padding: 40px 30px;
            margin-top: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.5rem;
            color: #8b5a2b;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.05rem;
            margin-bottom: 15px;
            text-align: left;
            color: #555;
        }

        .highlight {
            background-color: #fff3cd;
            padding: 12px;
            border-left: 4px solid #ffc107;
            border-radius: 4px;
            font-weight: bold;
            color: #856404;
            margin: 25px 0;
            text-align: left;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background-color: #8b5a2b;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #705d53;
        }

        footer {
            background-color: #4a3b32;
            color: #fcf9f5;
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="logo">小さなパン工房ミール</h1>
    </header>

    <main class="container">
        <div class="notice-box">
            <div class="icon">📩</div>
            <h2>仮予約の申し込みを受け付けました！</h2>
            
            <p>まだ注文手続きは**完了していません**。</p>
            <p>ご登録いただいたメールアドレス宛に、注文確定用のリンクが記載された確認メールを自動送信いたしました。</p>
            
            <div class="highlight">
                ⚠️ 注意：有効期限は1時間です<br>
                メール本文内の「注文を確定する」URLをクリックし、期限内に最終確認と確定手続きを行ってください。
            </div>

            <p style="text-align: center; font-size: 0.9rem; color: #888;">
                ※メールが届かない場合は、迷惑メールフォルダ等もご確認ください。
            </p>

            <a href="index.html" class="btn">ホームへ戻る</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 小さなパン工房ミール. All Rights Reserved.</p>
    </footer>

</body>
</html>
